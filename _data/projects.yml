# Real Aresys repos, pulled from https://github.com/aresys-srl
#
# `url` is a domain-root path, not a site-relative one: GitHub Pages serves each
# project site at <custom-domain>/<repo>/, so these are intentionally root-relative
# and must NOT be run through `relative_url` / `site.baseurl`. Changing the custom
# domain keeps them working; a non-empty baseurl would break them.
- name: sct
  title: SAR Calibration Toolbox
  description: End-to-end toolbox for calibrating synthetic aperture radar systems.
  url: "/sct"
  language: Python
  featured: true

- name: perseo
  title: Perseo
  description: Python Ecosystem for Remote Sensing & Earth Observation.
  url: "/perseo"
  language: Python
  featured: true

- name: aresys_io
  title: Aresys Product Formats
  description: Official Python package for reading, writing and work with Aresys formats.
  url: "/aresys_io"
  language: Python
  featured: true

- name: eo_products
  title: EO Products
  description: Access Level-1 SAR Earth Observation products and auxiliary data across multiple formats and missions.
  url: "/eo_products"
  language: Python
  featured: false

- name: sct_plugins
  title: SCT Product Format Plugins
  description: SAR L1 product format plugins collection for the SAR Calibration Toolbox.
  url: "/sct_plugins"
  language: Python
  featured: true

- name: sct_plugins_analyses
  title: SCT Analyses Plugins
  description: SAR L1 quality analysis plugins collection for the SAR Calibration Toolbox.
  url: "/sct_plugins_analyses"
  language: Python
  featured: false
